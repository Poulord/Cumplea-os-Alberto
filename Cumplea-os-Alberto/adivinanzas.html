<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Competencia Mágica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header">
            <h1 class="site-title">Prueba de Competencia Mágica</h1>
            <p class="site-subtitle">Demuestra que mereces el acceso al expediente de Alberto. Cada respuesta correcta revela tu maestría en bromas y recuerdos compartidos.</p>
        </header>

        <section class="quiz-wrapper" id="quiz" aria-live="polite">
            <p class="question-counter" id="questionCounter"></p>
            <h2 class="question-text" id="questionText"></h2>
            <div class="answer-grid" id="answerOptions"></div>
            <p class="feedback" id="feedback"></p>
            <div class="results" id="results" hidden></div>
        </section>

        <div style="margin-top: 2.4rem; text-align: center;">
            <a class="return-link" href="index.html">⬅ Regresar a la Sala Común</a>
        </div>
    </div>

    <footer>
        Ministerio de Festejos Mágicos · Control de calidad de hechizos amistosos.
    </footer>

    <script src="adivinanzas.js" defer></script>
</body>
</html>
